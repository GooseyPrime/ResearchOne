# Dependabot settings.
#
# open-pull-requests-limit: 0 keeps routine version-update PRs off; security
# updates still arrive. The ignore rules apply to security updates too.
#
# Tailwind CSS: a major update changes how Tailwind plugs into the build
# (v4 needs @tailwindcss/postcss and a CSS rewrite). An automatic bump to v4
# on 24 Oct 2026 (#288) broke every frontend build until 26 Nov 2026, so a
# major Tailwind move happens only as a planned migration.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
