# Deploy ResearchOne backend to Emma runtime VM over SSH (VM builds from git main).
# Runs in parallel with Vercel frontend deploys; not coupled to Vercel success.
#
# Required secrets: EMMA_HOST, EMMA_USER, EMMA_SSH_KEY
# If those live under Settings → Environments → production, the job must set
# `environment: production` below (or duplicate secrets at repository level).
# Optional: EMMA_PORT (default 22), EMMA_DEPLOY_PATH (default /opt/researchone),
#           EMMA_KNOWN_HOSTS, EMMA_WRITE_BACKEND_ENV, EMMA_PUBLIC_HEALTH_URL,
#           DATABASE_ADMIN_URL (privileged Postgres URL for application_role bootstrap; passed as base64 on the wire)
#           REASSIGN_LEGACY_RESEARCH_OWNER (optional; set to "1" for ONE deploy to mass-assign legacy runs to LEGACY_OWNER_*)
#           LEGACY_OWNER_USER_ID or LEGACY_OWNER_EMAIL (Clerk id or users.email — e.g. brandon@intellmeai.com)
#
# If ssh: connect to host … port 22: Connection timed out — the VM must accept inbound
# SSH from GitHub-hosted runners (public IP, security group/firewall, sshd on EMMA_PORT).
# See: https://api.github.com/meta (actions key) for current runner IP ranges if allowlisting.

name: Deploy backend to Emma

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ecosystem.config.js'
      - 'scripts/**'
      - '.github/workflows/deploy-backend-emma.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-emma
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block Vitest/Jest mocks in application source
        run: bash "${{ github.workspace }}/scripts/ci/assert-no-test-mocks-in-app-src.sh"

      - name: Validate required secrets
        env:
          EMMA_HOST: ${{ secrets.EMMA_HOST }}
          EMMA_USER: ${{ secrets.EMMA_USER }}
          EMMA_SSH_KEY: ${{ secrets.EMMA_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "${EMMA_HOST}" ] || { echo "::error::Missing or empty EMMA_HOST"; exit 1; }
          [ -n "${EMMA_USER}" ] || { echo "::error::Missing or empty EMMA_USER"; exit 1; }
          [ -n "${EMMA_SSH_KEY}" ] || { echo "::error::Missing or empty EMMA_SSH_KEY"; exit 1; }

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EMMA_SSH_KEY }}

      - name: Configure SSH known_hosts
        env:
          EMMA_HOST: ${{ secrets.EMMA_HOST }}
          EMMA_PORT: ${{ secrets.EMMA_PORT }}
          EMMA_KNOWN_HOSTS: ${{ secrets.EMMA_KNOWN_HOSTS }}
        run: |
          set -e
          SSH_PORT="${EMMA_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${EMMA_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${EMMA_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          else
            echo "::warning::EMMA_KNOWN_HOSTS not set; using ssh-keyscan (prefer pinning host keys in a secret)."
            ssh-keyscan -p "${SSH_PORT}" -H "${EMMA_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          EMMA_USER: ${{ secrets.EMMA_USER }}
          EMMA_HOST: ${{ secrets.EMMA_HOST }}
          EMMA_PORT: ${{ secrets.EMMA_PORT }}
          EMMA_DEPLOY_PATH: ${{ secrets.EMMA_DEPLOY_PATH }}
          EMMA_WRITE_BACKEND_ENV: ${{ secrets.EMMA_WRITE_BACKEND_ENV }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          REASSIGN_LEGACY_RESEARCH_OWNER: ${{ secrets.REASSIGN_LEGACY_RESEARCH_OWNER }}
          LEGACY_OWNER_USER_ID: ${{ secrets.LEGACY_OWNER_USER_ID }}
          LEGACY_OWNER_EMAIL: ${{ secrets.LEGACY_OWNER_EMAIL }}
          LEGACY_RESEARCH_ASSIGN_SCOPE: ${{ secrets.LEGACY_RESEARCH_ASSIGN_SCOPE }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${EMMA_DEPLOY_PATH:-/opt/researchone}"
          SSH_PORT="${EMMA_PORT:-22}"
          REMOTE="${EMMA_USER}@${EMMA_HOST}"
          SSH_OPTS=(-o StrictHostKeyChecking=yes -o ConnectTimeout=30 -p "${SSH_PORT}")

          if [ -n "${EMMA_WRITE_BACKEND_ENV:-}" ]; then
            TMP="$(mktemp)"
            chmod 600 "${TMP}"
            printf '%s' "${EMMA_WRITE_BACKEND_ENV}" > "${TMP}"
            ssh "${SSH_OPTS[@]}" "${REMOTE}" \
              "mkdir -p '${DEPLOY_PATH}/backend' && cat > '${DEPLOY_PATH}/backend/.env' && chmod 600 '${DEPLOY_PATH}/backend/.env'" < "${TMP}"
            rm -f "${TMP}"
          fi

          B64_EXPORT=""
          if [ -n "${DATABASE_ADMIN_URL:-}" ]; then
            B64_EXPORT=" DATABASE_ADMIN_URL_B64='$(printf '%s' "${DATABASE_ADMIN_URL}" | base64 | tr -d '\n')'"
          fi

          LEGACY_EXPORT=""
          if [ -n "${REASSIGN_LEGACY_RESEARCH_OWNER:-}" ]; then
            LEGACY_EXPORT=" REASSIGN_LEGACY_RESEARCH_OWNER='${REASSIGN_LEGACY_RESEARCH_OWNER}'"
          fi
          if [ -n "${LEGACY_OWNER_USER_ID:-}" ]; then
            LEGACY_EXPORT="${LEGACY_EXPORT} LEGACY_OWNER_USER_ID='${LEGACY_OWNER_USER_ID}'"
          fi
          if [ -n "${LEGACY_OWNER_EMAIL:-}" ]; then
            LEGACY_EXPORT="${LEGACY_EXPORT} LEGACY_OWNER_EMAIL='${LEGACY_OWNER_EMAIL}'"
          fi
          if [ -n "${LEGACY_RESEARCH_ASSIGN_SCOPE:-}" ]; then
            LEGACY_EXPORT="${LEGACY_EXPORT} LEGACY_RESEARCH_ASSIGN_SCOPE='${LEGACY_RESEARCH_ASSIGN_SCOPE}'"
          fi

          ssh "${SSH_OPTS[@]}" "${REMOTE}" \
            "cd '${DEPLOY_PATH}' && export DEPLOY_SOURCE=github-actions RESEARCHONE_DEPLOY_PATH='${DEPLOY_PATH}'${B64_EXPORT}${LEGACY_EXPORT} && bash ./scripts/deploy-runtime.sh"

      # Cannot use `secrets` in step `if:` — gate inside the script instead.
      - name: Optional public health check
        env:
          EMMA_PUBLIC_HEALTH_URL: ${{ secrets.EMMA_PUBLIC_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${EMMA_PUBLIC_HEALTH_URL:-}" ]; then
            echo "Skipping public health check (EMMA_PUBLIC_HEALTH_URL not set)."
            exit 0
          fi

          # Retry to absorb post-deploy warm-up (pm2 restart, proxy cache, TLS handshake).
          attempts=12
          sleep_s=5
          for i in $(seq 1 "${attempts}"); do
            http_code=$(curl -sS -o /tmp/health.out -w '%{http_code}' \
              --max-time 30 "${EMMA_PUBLIC_HEALTH_URL}" || echo "000")
            echo "Attempt ${i}/${attempts}: HTTP ${http_code}"
            if [ "${http_code}" = "200" ]; then
              echo "Health check OK."
              cat /tmp/health.out || true
              exit 0
            fi
            if [ "${i}" -lt "${attempts}" ]; then
              sleep "${sleep_s}"
            fi
          done

          echo "::error::Public health check failed after ${attempts} attempts (last HTTP ${http_code})."
          echo "----- last response body -----"
          cat /tmp/health.out || true
          exit 1
