version: "3.9"

services:
  # For local development only — production uses the 3 Emma VMs
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: researchone
      POSTGRES_USER: researchone
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchone"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://researchone:devpassword@postgres:5432/researchone
      REDIS_URL: redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/exports:/app/exports
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite inlines these at build time; Docker does not inherit them from the
      # host, so each needs an explicit build arg.
      #
      # Deliberately `:-` and not `:?`. Compose resolves every substitution
      # while LOADING the project, before it honours a requested service
      # subset — so `${VAR:?...}` here would fail `docker compose up -d
      # postgres`, a command that never touches the frontend (Codex, #220).
      # The requirement belongs where it can be scoped to the frontend build,
      # and `vite.config.ts` already fails that build by name.
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
