# Emma API reverse proxy (split deploy: frontend on Vercel).
# Installed to /etc/nginx/sites-available/researchone by setup-runtime.sh
# and refreshed on each deploy via scripts/sync-nginx-api-site.sh.
#
# client_max_body_size must be >= MAX_FILE_SIZE_MB (default 50) plus multipart
# overhead. Nginx default is 1m — without this, PDF uploads fail with 413 and
# browsers report a misleading CORS error (nginx 413 pages omit CORS headers).

server {
    listen 80;
    server_name _;

    # Match backend multer limit (MAX_FILE_SIZE_MB, default 50) + headroom.
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /exports/ {
        alias /opt/researchone/exports/;
        add_header Content-Disposition "attachment";
        add_header Access-Control-Allow-Origin "*";
    }

    location /health {
        proxy_pass http://127.0.0.1:3001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
