# Emma API reverse proxy (split deploy: frontend on Vercel).
# Installed to /etc/nginx/sites-available/researchone by setup-runtime.sh
# and refreshed on each deploy via scripts/sync-nginx-api-site.sh.
#
# TLS certificate: /etc/letsencrypt/live/research-api.intellmeai.com/
#   Covers: api.researchone.io, research-api.intellmeai.com
#   Renewed via: certbot renew (cron/systemd timer — not managed by deploy)
#   The repository owns this nginx topology; Certbot owns the certificate material.
#
# client_max_body_size must be >= MAX_FILE_SIZE_MB (default 50) plus multipart
# overhead. Nginx default is 1m — without this, PDF uploads fail with 413 and
# browsers report a misleading CORS error (nginx 413 pages omit CORS headers).

# Default server: silently drop requests that don't match either API domain.
# Without this, the redirect block below would match any Host header and
# redirect to an arbitrary host — an open-redirect risk.
server {
    listen 80 default_server;
    server_name "";
    return 444;
}

# HTTP: redirect known API domains to HTTPS.
server {
    listen 80;
    server_name api.researchone.io research-api.intellmeai.com;

    return 301 https://$host$request_uri;
}

# HTTPS: main API server block — proxy to Node backend on 127.0.0.1:3001.
server {
    listen 443 ssl;
    server_name api.researchone.io research-api.intellmeai.com;

    # Let's Encrypt certificate covering both API domains.
    ssl_certificate     /etc/letsencrypt/live/research-api.intellmeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/research-api.intellmeai.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Match backend multer limit (MAX_FILE_SIZE_MB, default 50) + headroom.
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /exports/ {
        alias /opt/researchone/exports/;
        add_header Content-Disposition "attachment";
        add_header Access-Control-Allow-Origin "*";
    }

    location /health {
        proxy_pass http://127.0.0.1:3001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
