# TruVector Core API nginx reverse proxy.
# Modelled on scripts/nginx/researchone-api-site.conf.
# Install to /etc/nginx/sites-available/truvector and enable:
#   sudo ln -sf /etc/nginx/sites-available/truvector /etc/nginx/sites-enabled/truvector
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: obtain a certificate for api.truvector.io before enabling HTTPS block.
#   sudo certbot --nginx -d api.truvector.io
#
# Port: 3000 (truvector-api PM2 process; ResearchOne holds 3001).

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name api.truvector.io;
    return 301 https://$host$request_uri;
}

# HTTPS main block
server {
    listen 443 ssl;
    server_name api.truvector.io;

    ssl_certificate     /etc/letsencrypt/live/api.truvector.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.truvector.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Match app body-size limit (adjust if TruVector raises its own limit).
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
