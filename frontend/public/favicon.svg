<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Contradiction Ring (Option 3): rounded hexagon + dual Möbius-like parallel strokes -->
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0A0E1A"/>
  <!-- Rounded hexagon outline -->
  <path d="M16 3 L27 9.5 L27 22.5 L16 29 L5 22.5 L5 9.5 Z"
        stroke="#2DD4BF" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
  <!-- Upper stroke (cyan) — consensus cluster arc -->
  <path d="M10 13 Q13 10 16 13 Q19 16 22 13"
        stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Lower stroke (amber) — anomaly bridge arc -->
  <path d="M10 19 Q13 22 16 19 Q19 16 22 19"
        stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
