<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0B1220"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#1E3A5F" stroke-width="2"/>
  <!-- Contradiction Ring: rounded hexagon + dual möbius strokes -->
  <g transform="translate(280 315)">
    <polygon points="0,-110 95.3,-55 95.3,55 0,110 -95.3,55 -95.3,-55" fill="none" stroke="#5BC0EB" stroke-width="4" stroke-linejoin="round"/>
    <path d="M -50,0 C -50,-40 50,-40 50,0 C 50,40 -50,40 -50,0" fill="none" stroke="#5BC0EB" stroke-width="5" stroke-linecap="round"/>
    <path d="M -40,12 C -40,-28 60,-28 60,12 C 60,52 -40,52 -40,12" fill="none" stroke="#A78BFA" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="480" y="280" fill="#F1F5F9" font-family="system-ui,Segoe UI,sans-serif" font-size="64" font-weight="700">ResearchOne</text>
  <text x="480" y="340" fill="#94A3B8" font-family="system-ui,Segoe UI,sans-serif" font-size="28">Adaptive deep research with plan-first</text>
  <text x="480" y="380" fill="#94A3B8" font-family="system-ui,Segoe UI,sans-serif" font-size="28">workflows, specialist analysis, and</text>
  <text x="480" y="420" fill="#94A3B8" font-family="system-ui,Segoe UI,sans-serif" font-size="28">cited reports that keep disagreements visible.</text>
</svg>
